<div class="card">
    <div class="header">
        <h1>{{ kpiName() }}</h1>
    </div>
    <div class="container">
        @if (isLoading()) {
            <p class="skeleton">&nbsp;</p>
        } @else if (hasError()) {
            <p class="error">--</p>
        } @else {
            <p>{{ kpiNumber() }}</p>
        }
    </div>
</div>
