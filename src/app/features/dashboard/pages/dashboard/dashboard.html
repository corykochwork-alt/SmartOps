<header class="dashboard-header">
    <div>
        <p class="eyebrow">Operations overview</p>
        <h1>Dashboard</h1>
    </div>
    <button type="button" (click)="refresh()">Refresh data</button>
</header>

<div class="kpis">
    <app-kip-cards routerLink="/alarms" [kpiName]="metrics().activeAlarms.Name" [kpiNumber]="metrics().activeAlarms.Number" [isLoading]="isLoading()" [hasError]="!!hasError()"></app-kip-cards>
    <app-kip-cards routerLink="/assets" [kpiName]="metrics().assetsOnline.Name" [kpiNumber]="metrics().assetsOnline.Number" [isLoading]="isLoading()" [hasError]="!!hasError()"></app-kip-cards>
    <app-kip-cards routerLink="/analytics" [kpiName]="metrics().uptime.Name" [kpiNumber]="metrics().uptime.Number" [isLoading]="isLoading()" [hasError]="!!hasError()"></app-kip-cards>
    <app-kip-cards routerLink="/analytics" [kpiName]="metrics().averageResponse.Name" [kpiNumber]="metrics().averageResponse.Number" [isLoading]="isLoading()" [hasError]="!!hasError()"></app-kip-cards>
</div>

<div class="alarms">
    <app-alarm-trend-chart></app-alarm-trend-chart>
    <app-recent-alarms></app-recent-alarms>
</div>

<app-top-assets></app-top-assets>
